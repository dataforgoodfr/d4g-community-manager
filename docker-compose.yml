version: '3.8'

services:
  marty-bot:
    build: .
    container_name: marty-bot
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
  marty-frontend:
      build: ./frontend
      ports:
        - "3007:3007"
      volumes:
        - ./frontend:/app
        - /app/node_modules
      environment:
        - CHOKIDAR_USEPOLLING=true
        - NODE_ENV=development